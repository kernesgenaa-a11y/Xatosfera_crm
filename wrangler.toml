name = "xatosfera-api-ts"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "xatosfera"
database_id = "017e14d7-21c3-4f26-b311-8e0037557ec1"

[[r2_buckets]]
binding = "R2"
bucket_name = "xatosfera"

[images]
binding = "IMAGES"

[[queues.producers]]
binding = "IMAGES_QUEUE"
queue = "crm-images"

[[queues.consumers]]
queue = "crm-images"

[browser]
binding = "BROWSER"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = false
head_sampling_rate = 1


# Secrets (set via: wrangler secret put CF_ACCOUNT_ID / CF_API_TOKEN)
# These are used for Browser Rendering REST API to generate PDF presentations
# CF_ACCOUNT_ID = your Cloudflare account ID
# CF_API_TOKEN  = token with Browser Rendering permission
